<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Java Calendar</title>
	<link rel="stylesheet" type="text/css" href="css/java-calendar.css">
	<style>
		body {
			margin: 0;
			font-family: "Segoe UI", Roboto, Arial, sans-serif;
			background: var(--muted);
			color: var(--text);
			-webkit-font-smoothing: antialiased;
		}
	</style>
</head>

<body>

	<div id="java-calendar"></div>

	<script src="js/java-calendar.js"></script>

	<script>
		async function getHolidays(year = new Date().getFullYear()) {
			const holidays = {};

			try {
				let response;
				try {
					// Panggil proxy lokal holidays.php agar bebas dari kendala CORS di browser
					response = await fetch(`holidays.php?year=${year}`);
				} catch (e) {
					// Fallback direct request
					response = null;
				}

				if (!response || !response.ok) {
					response = await fetch(`https://use.api.co.id/holidays/indonesia/?year=${year}`, {
						method: 'GET',
						headers: {
							'Content-Type': 'application/json',
							'x-api-co-id': 'uRMv0VXbybij6FZRTA69GGxP4SyLO6DSi0yqezW6pLewqFfz9Z',
						}
					});
				}

				if (response.ok) {
					const result = await response.json();

					// Data dari use.api.co.id berbentuk array di properti result.data
					if (result.is_success && Array.isArray(result.data)) {
						result.data.forEach(item => {
							// Format tanggal item.date adalah "YYYY-MM-DD"
							const [y, m, d] = item.date.split('-').map(Number);
							const key = `${y}-${m}-${d}`;

							// Tentukan warna/tipe indikator berdasarkan tipe event
							let eventType = 'red';
							if (item.is_holiday || item.type === 'Public Holiday') {
								eventType = 'red'; // Libur Nasional
							} else if (item.is_joint_holiday || item.type === 'Joint Holiday') {
								eventType = 'blue'; // Cuti Bersama
							} else if (item.is_observance || item.type === 'Observance') {
								eventType = 'green'; // Hari Peringatan / Nasional
							}

							const eventObj = {
								title: item.name,
								type: eventType,
								startDate: key,
								endDate: key,
								description: `${item.type}: ${item.name} (${item.date_formatted || item.date})`
							};

							if (!holidays[key]) {
								holidays[key] = [];
							}
							holidays[key].push(eventObj);
						});
					}
				}
			} catch (error) {
				console.warn('Gagal memuat hari libur dari API, menggunakan data lokal/contoh:', error);
			}

			// Contoh event multi-hari & lokal untuk tahun berjalan (bisa disesuaikan dengan sumber data Anda)
			holidays[`${year}-12-25`] = {
				title: 'Libur Natal',
				type: 'red',
				startDate: `${year}-12-25`,
				endDate: `${year}-12-27`,  // libur sampai 27 Desember
				description: 'Libur Natal dan Boxing Day. Hari raya umat Kristiani untuk memperingati kelahiran Yesus Kristus.'
			};

			holidays[`${year}-10-5`] = [
				{ "title": "Rapat OSIS", "type": "blue", "startDate": `${year}-10-5`, "endDate": `${year}-10-7`, "description": "Rapat koordinasi pengurus OSIS." },
				{ "title": "Rapat Guru", "type": "yellow", "startDate": `${year}-10-5`, "endDate": `${year}-10-5`, "description": "Rapat bulanan dewan guru." },
				{ "title": "Pengajian Akbar", "type": "green", "startDate": `${year}-10-5`, "endDate": `${year}-10-5`, "description": "Pengajian akbar menyambut tahun ajaran baru." },
				{ "title": "Libur ahad", "type": "red", "startDate": `${year}-10-5`, "endDate": `${year}-10-5`, "description": "Libur akhir pekan." }
			];

			// Contoh event lintas bulan
			holidays[`${year}-9-27`] = {
				title: 'Imtihan Semester',
				type: 'blue',
				startDate: `${year}-9-27`,
				endDate: `${year}-10-2`,  // dari September ke Oktober
				description: 'Libur panjang akhir bulan September hingga awal Oktober. Waktu yang tepat untuk berlibur bersama keluarga.'
			};

			return holidays;
		}

		getHolidays().then(holidays => {
			jCalendar('java-calendar', { holidays });
		});


	</script>
</body>

</html>
